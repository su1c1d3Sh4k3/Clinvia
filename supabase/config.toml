# =============================================
# ESTADO REAL DE PRODUCAO, TRAZIDO PARA O REPOSITORIO (23/09/2026)
# =============================================
# Estas 29 estavam com `verify_jwt = false` NO PROJETO mas nao aqui — foram
# abertas um dia com `--no-verify-jwt` na linha de comando, e a flag ficou so la.
#
# Isso e uma armadilha silenciosa: `--no-verify-jwt` e um caminho de mao unica.
# Um `supabase functions deploy <nome>` comum, sem a flag, NAO restaura a
# abertura — ele FECHA a function, porque o CLI manda o que esta neste arquivo.
# Ou seja, qualquer redeploy de rotina derrubaria de uma vez os webhooks do
# Google Calendar, do Instagram e da Evolution, o retorno do OAuth, o pedido de
# nova senha e os workers chamados por cron, todos com 401 do gateway e sem
# nenhum erro no codigo para explicar.
#
# Registrar aqui nao ABRE nada: elas ja estao abertas. O que muda e que o
# repositorio passa a dizer a verdade e o deploy em lote vira idempotente.
#
# NAO e um atestado de que as 29 DEVEM ficar abertas. As que se defendem por
# conta propria (x-api-key, assinatura de webhook, chave de servico) estao
# certas; as demais precisam de uma revisao de autenticacao que nao cabe num
# lote de monitoramento — fechar qualquer uma delas aqui, de passagem, seria
# trocar ruido no painel por indisponibilidade de verdade.
# =============================================

