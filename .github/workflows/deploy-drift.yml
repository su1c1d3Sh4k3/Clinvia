# Funcao implantada sem fonte no repositorio nao pode nascer de novo.
#
# Apagar `supabase/functions/<slug>/` NAO remove a funcao do projeto Supabase:
# ela fica ACTIVE, publicamente alcancavel, rodando o ultimo bundle publicado --
# codigo que ninguem mais consegue ler pelo git. Foi assim que 19 funcoes
# ficaram no ar por ate 7 meses e meio, duas delas escrevendo sem autenticacao.
#
# Este job falha quando isso acontece. Ele NAO e o build do frontend (que e
# manual, no EasyPanel): e um sinal de status no push/PR.
#
# Exige o segredo SUPABASE_ACCESS_TOKEN no repositorio (Settings > Secrets and
# variables > Actions). Sem ele o job falha de proposito, em vez de passar
# calado -- teste que passa sem medir nada e pior que teste nenhum.

# O segundo job e da mesma familia: `supabase.functions.invoke` chamado sem
# tratar o `error`. A funcao NAO lanca -- devolve `{ data, error }` --, entao a
# chamada falha e o codigo segue para o `toast.success`. Consertar os pontos
# vale pouco; o que vale e o proximo ponto nao nascer. Detalhe do porque e da
# dispensa: `eslint.invoke.config.js`.

name: barreiras

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  edge-functions-sem-fonte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Funcoes implantadas sem fonte no repo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: swfshqvvbohnahdyndch
        run: python supabase/tests/security/deploy_drift/check.py

  # Job SEPARADO de proposito: nao depende de segredo nenhum, entao continua
  # medindo mesmo enquanto o SUPABASE_ACCESS_TOKEN nao estiver configurado.
  invoke-sem-tratar-erro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: functions.invoke sem tratar o error
        run: npm run lint:invoke

  # Terceiro da familia, e o espelho do segundo na outra ponta: o front que
  # engole o motivo x a function que devolve motivo demais. Tambem nao depende
  # de segredo -- le so o repositorio.
  erro-cru-na-resposta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Texto cru de erro interno no corpo da resposta
        run: python supabase/tests/security/item_erro_cru_na_resposta/check.py

  # Quarto da familia. O admintoken da UAZAPI viveu meses em `src/lib/uzapi.ts`,
  # que roda no NAVEGADOR: o bundle publico entregava a credencial de
  # administrador do provedor a cada visitante, e o unico consumidor dela era
  # codigo morto. Codigo morto nao e segredo morto -- o bundler inclui a string
  # do mesmo jeito. Le so o repositorio, nao depende de segredo.
  segredo-no-codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Segredo em texto puro no codigo versionado
        run: python supabase/tests/security/item_segredo_no_codigo/check.py

  # Quinto da familia, e o mais cru de todos: `catch { }` vazio dentro de edge
  # function. Nao sobra nem linha de log -- o erro deixou de existir, e nenhuma
  # das quatro barreiras acima o veria. Tolerancia zero para o catch mudo;
  # catch que so chama `console.*` e divida contada em `divida.json`, em
  # catraca (ponto novo reprova, ponto consertado tambem, ate baixar a base com
  # `--gravar`). Le so o repositorio, nao depende de segredo.
  catch-mudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Catch que engole o erro em edge function
        run: python supabase/tests/security/item_catch_mudo/check.py
